<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="flower Garden">
<title>Flower Garden</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
/* ===== main.css (UNCHANGED) ===== */

:root {
    --bg-color: #f8f5f2;
    --text-color: #dbdbdb;
    --accent-color: #ff6b6b;
    --accent-hover: #ff5252;
    --ui-glass: rgba(153, 194, 171, 0.534);
    --ui-border: rgba(255, 255, 255, 0.5);
    --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
    --font-serif: 'Playfair Display', serif;
    --font-sans: 'Inter', sans-serif;
}

[data-theme="dark"] {
    --bg-color: #1a1a2e;
    --text-color: #e0e0e0;
    --accent-color: #ff8fa3;
    --accent-hover: #ff758f;
    --ui-glass: rgba(20, 20, 35, 0.75);
    --ui-border: rgba(255, 255, 255, 0.1);
    --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
}

* {
    box-sizing: border-box;
    transition: background-color 0.3s ease, color 0.3s ease;
}

html, body {
    overflow: hidden;
    padding: 0;
    margin: 0;
    background-color: var(--bg-color);
    font-family: var(--font-sans);
    color: var(--text-color);
}

.container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
}

.header {
    position: absolute;
    top: 2rem;
    left: 2rem;
    pointer-events: none;
    z-index: 10;
    transition: opacity 1s ease;
}

.logo {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0;
    color: var(--text-color);
    opacity: 0;
    animation: fadeInDown 1s ease-out 0.5s forwards;
}

.name {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.text-line {
    font-size: 1.6rem;
    font-weight: 300;
    opacity: 0;
    animation: fadeInUp 1s ease-out 0.2s forwards;
}

.text-highlight {
    font-family: var(--font-serif);
    font-size: 4rem;
    font-weight: 600;
    background: linear-gradient(45deg, var(--accent-color), #a29bfe);
    -webkit-background-clip: text;
    color: transparent;
    opacity: 0;
    animation: fadeInUp 1s ease-out 0.4s forwards;
}

.controls {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1.2rem;
    z-index: 20;
}

button {
    background: var(--ui-glass);
    border: 1px solid var(--ui-border);
    padding: 0.8rem 1.8rem;
    border-radius: 50px;
    color: var(--text-color);
    cursor: pointer;
}

button.active {
    background: var(--accent-color);
    color: white;
}

.footer {
    position: absolute;
    bottom: 0.8rem;
    right: 2rem;
    font-size: 0.7rem;
    opacity: 0.4;
}

/* animations */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
    <canvas id="canvas"></canvas>
    <div class="particles" id="particles"></div>

    <header class="header">
        <h1 class="logo">🌸 Flower Garden for You </h1>
    </header>

    <div class="name">
        <span class="text-line">Click Anywhere to</span>
        <span class="text-highlight">Plant Flowers</span>
        <span class="text-line">✨ or turn on Auto Bloom</span>
    </div>

    <div class="controls">
        <button class="clean-btn" id="cleanBtn">🧹 Clear Garden</button>
        <button class="auto-btn" id="autoBtn">✨ Auto Bloom</button>
    </div>

    <footer class="footer">
        <span>Made with 💖 | Tap to grow flowers</span>
    </footer>
</div>

</html>
